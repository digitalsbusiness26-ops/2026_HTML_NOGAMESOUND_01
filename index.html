<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tag Explorer Game</title>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #282c34;
            color: #00ff00;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .game-container {
            background-color: #1a1c21;
            border: 2px solid #00ff00;
            box-shadow: 0 0 15px #00ff00;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 800px;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            color: #ff00ff;
            font-size: 2em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 5px rgba(0, 255, 0, 0.5);
        }

        .instructions {
            font-size: 0.9em;
            margin-bottom: 25px;
            color: #00ffff;
        }

        .challenge-box {
            background-color: #2a2d33;
            border: 1px dashed #00ff00;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        #challenge-text {
            font-size: 1.2em;
            margin-bottom: 15px;
            color: #f0f0f0;
        }

        #tagInput {
            padding: 10px;
            margin-right: 10px;
            border: 1px solid #00ffff;
            background-color: #0d0e10;
            color: #00ff00;
            font-family: 'Press Start 2P', cursive;
            font-size: 1em;
            width: calc(100% - 180px);
            max-width: 250px;
        }

        button {
            padding: 10px 15px;
            background-color: #ff00ff;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8em;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #cc00cc;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        #checkButton {
            background-color: #007bff;
        }

        #checkButton:hover {
            background-color: #0056b3;
        }

        #nextButton {
            background-color: #28a745;
            margin-left: 10px;
        }

        #nextButton:hover {
            background-color: #218838;
        }

        #resetButton {
            background-color: #dc3545;
            margin-top: 15px;
            font-size: 0.7em;
            padding: 8px 12px;
        }

        #resetButton:hover {
            background-color: #bd2130;
        }

        .feedback-box {
            min-height: 20px;
            margin-bottom: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .feedback-correct {
            color: #28a745;
        }

        .feedback-wrong {
            color: #dc3545;
        }

        .display-area {
            background-color: #0d0e10;
            border: 1px solid #00ff00;
            padding: 20px;
            min-height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            margin-top: 20px;
        }

        #display-content {
            color: #ffffff;
            font-size: 1.2em;
            text-align: center;
            width: 100%;
        }

        #display-content h1 {
            font-size: 2.5em;
            color: #ff00ff;
            margin: 0;
            text-shadow: none;
        }

        #display-content p {
            font-size: 1.2em;
            color: #00ffff;
            margin: 0;
        }

        #display-content a {
            color: #f9d71c;
            text-decoration: underline;
            cursor: pointer;
        }

        #display-content img {
            max-width: 100%;
            height: auto;
            border: 2px solid #00ff00;
            margin: 10px 0;
        }

        #display-content ul {
            text-align: left;
            list-style-type: disc;
            padding-left: 20px;
            color: #f0f0f0;
        }

        #display-content ol {
            text-align: left;
            list-style-type: decimal;
            padding-left: 20px;
            color: #f0f0f0;
        }

        #display-content strong {
            font-weight: bold;
            color: #ff9900;
        }

        #display-content em {
            font-style: italic;
            color: #66ccff;
        }

        #display-content button {
            background-color: #e74c3c;
            padding: 10px 20px;
            font-size: 1em;
            margin-top: 10px;
        }

        #display-content button:hover {
            background-color: #c0392b;
        }

        #display-content input[type="text"] {
            padding: 8px;
            border: 1px solid #9b59b6;
            background-color: #1a1c21;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .score-box {
            margin-top: 25px;
            font-size: 1.1em;
            color: #ffcc00;
        }

        .feedback-correct.animate {
            animation: fadeOut 2s forwards;
        }

        @keyframes fadeOut {
            0% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="game-container">

        <h1>HTML Chapter 1 Tags & Attributes Explorer</h1>

        <p class="instructions">
            Type the HTML tag (e.g., &lt;p&gt;) or attribute (e.g., src) to make things happen!
        </p>

        <div class="challenge-box">

            <p id="challenge-text"></p>

            <input
                type="text"
                id="tagInput"
                placeholder="Type your answer"
                autocomplete="off"
            >

            <button id="checkButton">Check Answer</button>

            <button id="nextButton" disabled>
                Next Challenge
            </button>

        </div>

        <div class="feedback-box" id="feedback-box"></div>

        <div class="display-area">
            <div id="display-content"></div>
        </div>

        <div class="score-box">
            Score:
            <span id="score">0</span>
        </div>

        <div>
            <button id="resetButton">Reset Progress</button>
        </div>

    </div>

    <script>

        document.addEventListener('DOMContentLoaded', () => {

            const challengeText = document.getElementById('challenge-text');
            const tagInput = document.getElementById('tagInput');
            const checkButton = document.getElementById('checkButton');
            const nextButton = document.getElementById('nextButton');
            const resetButton = document.getElementById('resetButton');
            const feedbackBox = document.getElementById('feedback-box');
            const displayContent = document.getElementById('display-content');
            const scoreSpan = document.getElementById('score');

            let currentChallengeIndex = 0;
            let score = 0;

            const challenges = [
                {
                    prompt: "Make this text a very important heading.",
                    correctTag: "<h1>",
                    answerType: "tag",
                    displayHTML: "<h1>VERY IMPORTANT HEADING</h1>"
                },
                {
                    prompt: "Declare the document type for modern HTML5.",
                    correctTag: "<!DOCTYPE html>",
                    answerType: "doctype",
                    displayHTML: "<!DOCTYPE html>"
                },
                {
                    prompt: "Define the root element that wraps all page content.",
                    correctTag: "<html>",
                    answerType: "tag",
                    displayHTML: "<html lang=\"en\">...</html>"
                },
                {
                    prompt: "Create standard opening and closing tags around content.",
                    correctTag: "<tag>",
                    answerType: "tag",
                    displayHTML: "<tag>Content goes here</tag>"
                },
                {
                    prompt: "Define the head section for page metadata and scripts.",
                    correctTag: "<head>",
                    answerType: "tag",
                    displayHTML: "<head><title>Page Title</title></head>"
                },
                {
                    prompt: "Set the web page title shown in the browser tab.",
                    correctTag: "<title>",
                    answerType: "tag",
                    displayHTML: "<title>My Awesome Website</title>"
                },
                {
                    prompt: "Add hidden machine-readable metadata about the page.",
                    correctTag: "<meta>",
                    answerType: "tag",
                    displayHTML: "<meta name=\"author\" content=\"John Doe\">"
                },
                {
                    prompt: "Define the main container for all visible page content.",
                    correctTag: "<body>",
                    answerType: "tag",
                    displayHTML: "<body><h1>Hello World</h1></body>"
                },
                {
                    prompt: "Set the character encoding to UTF-8.",
                    correctTag: "charset=\"utf-8\"",
                    answerType: "attribute",
                    displayHTML: "<meta charset=\"utf-8\">"
                },
                {
                    prompt: "Write a standard paragraph element using correct HTML syntax.",
                    correctTag: "<p>",
                    answerType: "tag",
                    displayHTML: "<p>This is a standard paragraph.</p>"
                },
                {
                    prompt: "Which attribute declared on the <html> root element specifies that the primary language of the web page is English for search engines and screen readers?",
                    correctTag: "lang=\"en\"",
                    answerType: "attribute",
                    displayHTML: "<html lang=\"en\">\n  <head></head>\n  <body></body>\n</html>"
                },
                {
                    prompt: "Create a clickable hyperlink to another web page.",
                    correctTag: "<a>",
                    answerType: "tag",
                    displayHTML: "<a href=\"https://example.com\">Click Here</a>"
                },
                {
                    prompt: "Which critical tag must be declared near the very top of the <head> section so the browser decodes text and special characters correctly before parsing the title?",
                    correctTag: "<meta charset=\"utf-8\">",
                    answerType: "tag",
                    displayHTML: "<head>\n  <meta charset=\"utf-8\">\n  <title>My Web Page</title>\n</head>"
                },
                {
                    prompt: "Insert a void (empty) line break element.",
                    correctTag: "<br>",
                    answerType: "tag",
                    displayHTML: "First line<br>Second line"
                },
                {
                    prompt: "Embed an image into the document.",
                    correctTag: "<img>",
                    answerType: "tag",
                    displayHTML: "<img src=\"photo.jpg\" alt=\"A sunny landscape\">"
                },
                {
                    prompt: "Which tag lets you add a note explaining that the browser reads code from top to bottom without rendering text on the page?",
                    correctTag: "<!-- -->",
                    answerType: "tag",
                    displayHTML: "<!-- Parsed sequentially from top to bottom -->"
                },
                {
                    prompt: "Specify the image file location using the source attribute.",
                    correctTag: "src",
                    answerType: "attribute",
                    displayHTML: "<img src=\"picture.jpg\">"
                },
                {
                    prompt: "Add alternative text for screen readers and missing images.",
                    correctTag: "alt",
                    answerType: "attribute",
                    displayHTML: "<img src=\"logo.png\" alt=\"Company Logo\">"
                },
                {
                    prompt: "Create a block-level container that starts on a new line.",
                    correctTag: "<div>",
                    answerType: "tag",
                    displayHTML: "<div>Block level container</div>"
                },
                {
                    prompt: "Which inline element wraps a specific piece of text so you can apply a custom background color with CSS?",
                    correctTag: "<span>",
                    answerType: "tag",
                    displayHTML: "<p>This text has a <span style=\"background-color: yellow;\">yellow background</span>.</p>"
                },
                {
                    prompt: "Define SEO keywords in a meta tag attribute.",
                    correctTag: "name=\"keywords\"",
                    answerType: "attribute",
                    displayHTML: "<meta name=\"keywords\" content=\"web, dev, html\">"
                },
                {
                    prompt: "Provide a page summary description for search results.",
                    correctTag: "name=\"description\"",
                    answerType: "attribute",
                    displayHTML: "<meta name=\"description\" content=\"Learn HTML basics.\">"
                }
            ];

            function loadSavedProgress() {
                const savedScore = localStorage.getItem('htmlExplorerScore');
                const savedIndex = localStorage.getItem('htmlExplorerIndex');

                if (savedScore !== null) {
                    score = parseInt(savedScore, 10);
                }
                if (savedIndex !== null) {
                    currentChallengeIndex = parseInt(savedIndex, 10);
                }
            }

            function saveProgress() {
                localStorage.setItem('htmlExplorerScore', score);
                localStorage.setItem('htmlExplorerIndex', currentChallengeIndex);
            }

            function updateScoreDisplay() {
                scoreSpan.textContent = `${score} | Question: ${currentChallengeIndex + 1} / ${challenges.length}`;
            }

            function loadChallenge() {
                if (currentChallengeIndex >= challenges.length) {
                    challengeText.textContent = "Game Over! You completed all challenges!";
                    tagInput.disabled = true;
                    checkButton.disabled = true;
                    nextButton.disabled = true;
                    displayContent.innerHTML = "<p>Great job exploring HTML tags!</p>";
                    feedbackBox.textContent = "";
                    updateScoreDisplay();
                    return;
                }

                const challenge = challenges[currentChallengeIndex];

                challengeText.textContent = challenge.prompt;
                tagInput.value = "";
                tagInput.disabled = false;
                checkButton.disabled = false;
                nextButton.disabled = true;
                feedbackBox.textContent = "";
                feedbackBox.className = "feedback-box";
                displayContent.innerHTML = "";
                tagInput.focus();

                updateScoreDisplay();
            }

            function checkTag() {
                const userAnswer = tagInput.value.trim().toLowerCase();
                const challenge = challenges[currentChallengeIndex];
                const correctAnswer = challenge.correctTag.toLowerCase();

                let isCorrect = false;

                if (challenge.answerType === "tag") {
                    let cleanedUserAnswer;
                    if (userAnswer.startsWith("<") && userAnswer.endsWith(">")) {
                        cleanedUserAnswer = userAnswer;
                    } else {
                        cleanedUserAnswer = `<${userAnswer}>`;
                    }
                    isCorrect = cleanedUserAnswer === correctAnswer;
                } else if (challenge.answerType === "attribute" || challenge.answerType === "doctype") {
                    isCorrect = userAnswer === correctAnswer;
                }

                if (isCorrect) {
                    feedbackBox.textContent = "Correct! 🎉";
                    feedbackBox.className = "feedback-box feedback-correct";

                    score++;
                    saveProgress();

                    tagInput.disabled = true;
                    checkButton.disabled = true;
                    nextButton.disabled = false;

                    displayContent.innerHTML = challenge.displayHTML;

                    feedbackBox.classList.add("animate");
                    setTimeout(() => {
                        feedbackBox.classList.remove("animate");
                    }, 2000);

                    updateScoreDisplay();
                } else {
                    if (challenge.answerType === "attribute") {
                        feedbackBox.textContent = "Try again! Enter the attribute without < >.";
                    } else if (challenge.answerType === "doctype") {
                        feedbackBox.textContent = "Try again! Enter the complete <!DOCTYPE html>.";
                    } else {
                        feedbackBox.textContent = "Try again! Enter the HTML tag, such as <p> or p.";
                    }

                    feedbackBox.className = "feedback-box feedback-wrong";
                    tagInput.focus();
                }
            }

            checkButton.addEventListener("click", checkTag);

            nextButton.addEventListener("click", () => {
                currentChallengeIndex++;
                saveProgress();
                loadChallenge();
            });

            resetButton.addEventListener("click", () => {
                if (confirm("Are you sure you want to reset your score and start over?")) {
                    localStorage.removeItem('htmlExplorerScore');
                    localStorage.removeItem('htmlExplorerIndex');
                    score = 0;
                    currentChallengeIndex = 0;
                    loadChallenge();
                }
            });

            tagInput.addEventListener("keypress", (event) => {
                if (event.key === "Enter" && !checkButton.disabled) {
                    checkTag();
                }
            });

            loadSavedProgress();
            loadChallenge();

        });

    </script>

</body>
</html>
